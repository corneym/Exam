name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'

  pull_request:
    branches:
      - main

jobs:
  non-ui-tests:
    name: Non-UI tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run non-UI tests
        run: bash ./mvnw --batch-mode clean verify

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests
        run: xvfb-run --auto-servernum bash ./mvnw --batch-mode -Pui-tests test
		