name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'issue/**'
      - 'refactor/**'
      - 'chore/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-ui-tests:
    name: Non-UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run non-UI tests
        run: bash ./mvnw --batch-mode clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: non-ui-test-reports
          path: target/surefire-reports/
          retention-days: 7

  ui-tests:
    name: UI - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast-search
            suite: FastUISearchTests.java

          - name: fast-dashboard
            suite: FastUIDashboardTests.java

          - name: fast-remaining
            suite: FastUITests.java

          - name: capture-answers
            suite: WorkflowCaptureTests.java

          - name: capture-questions
            suite: WorkflowCaptureQuestionTests.java

          - name: state-context
            suite: WorkflowStateEditingTests.java

          - name: state-selection
            suite: WorkflowStateEditingSelectionTests.java

          - name: application-dashboard
            suite: WorkflowApplicationTests.java

          - name: application-layout
            suite: WorkflowApplicationLayoutTests.java

          - name: application-curriculum
            suite: WorkflowApplicationCurriculumTests.java

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests
        run: xvfb-run --auto-servernum bash ./mvnw --batch-mode "-Dtest.suite=**/${{ matrix.suite }}" test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.name }}-test-reports
          path: target/surefire-reports/
          retention-days: 7
