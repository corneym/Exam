name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'chore/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-ui-tests:
    name: Non-UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run non-UI tests
        run: bash ./mvnw --batch-mode clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: non-ui-test-reports
          path: target/surefire-reports/
          retention-days: 7

  ui-tests-fast:
    name: UI tests - remaining
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run remaining UI tests
        run: xvfb-run --auto-servernum bash ./mvnw --batch-mode "-Dtest.suite=**/FastUITests.java" test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: remaining-ui-test-reports
          path: target/surefire-reports/
          retention-days: 7

  workflow-ui-tests:
    name: Workflow UI - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: capture
            suite: WorkflowCaptureTests.java

          - name: state-editing
            suite: WorkflowStateEditingTests.java

          - name: application
            suite: WorkflowApplicationTests.java

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run workflow UI tests
        run: xvfb-run --auto-servernum bash ./mvnw --batch-mode "-Dtest.suite=**/${{ matrix.suite }}" test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-ui-${{ matrix.name }}-test-reports
          path: target/surefire-reports/
          retention-days: 7
