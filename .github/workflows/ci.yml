name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: bash ./mvnw --batch-mode clean verify
        