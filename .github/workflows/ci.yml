ui-tests-fast:
  name: UI tests - remaining
  runs-on: ubuntu-latest

  steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Java 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Install virtual display
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Run remaining UI tests
      run: xvfb-run --auto-servernum bash ./mvnw --batch-mode "-Dtest.suite=**/FastUITests.java" test

ui-tests-workflow:
  name: UI tests - application workflow
  runs-on: ubuntu-latest

  steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Java 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Install virtual display
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Run application workflow UI tests
      run: xvfb-run --auto-servernum bash ./mvnw --batch-mode "-Dtest.suite=**/WorkflowUITests.java" test