name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: 'Commit SHA to test for a pinned release; defaults to event SHA'
        required: false
        type: string
        default: ''

  workflow_dispatch:

  push:
    branches:
      - main
      - 'feature/**'
      - 'issue/**'
      - 'refactor/**'
      - 'chore/**'
      - 'revision/**'
      - 'codex/**'

  pull_request:
    branches:
      - main
      - 'revision/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  non-ui-batches:
    name: Non-UI - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repository
            suite: NonUIRepositoryTests.java

          - name: work-packages
            suite: NonUIWorkPackageTests.java

          - name: services
            suite: NonUIServiceTests.java

          - name: core
            suite: NonUICoreTests.java

          - name: import-output
            suite: NonUIImportOutputTests.java

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run non-UI test batch
        run: bash ./mvnw --batch-mode "-Dtest.suite=**/${{ matrix.suite }}" clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: non-ui-${{ matrix.name }}-test-reports
          path: target/surefire-reports/
          retention-days: 7

  non-ui-tests:
    name: Non-UI tests
    needs: non-ui-batches
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all non-UI batches passed
        env:
          BATCH_RESULT: ${{ needs.non-ui-batches.result }}
        run: |
          if [ "$BATCH_RESULT" != "success" ]; then
            echo "Non-UI batches did not all succeed: $BATCH_RESULT"
            exit 1
          fi

          echo "All non-UI batches passed."


  ui-tests:
    name: UI - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast-search
            suite: FastUISearchTests.java

          - name: fast-dashboard
            suite: FastUIDashboardTests.java

          - name: fast-remaining
            suite: FastUITests.java

          - name: capture-answers
            suite: WorkflowCaptureTests.java

          - name: capture-questions
            suite: WorkflowCaptureQuestionTests.java

          - name: state-context
            suite: WorkflowStateEditingTests.java

          - name: state-selection
            suite: WorkflowStateEditingSelectionTests.java

          - name: application-dashboard
            suite: WorkflowApplicationTests.java

          - name: application-layout
            suite: WorkflowApplicationLayoutTests.java

          - name: application-curriculum
            suite: WorkflowApplicationCurriculumTests.java

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests
        run: xvfb-run --auto-servernum bash ./mvnw --batch-mode "-Dtest.suite=**/${{ matrix.suite }}" test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.name }}-test-reports
          path: target/surefire-reports/
          retention-days: 7
